[project]
name = "badminton-court-finder"
version = "0.1.0"
description = "Scrapes badminton court booking websites to find available time slots"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx",
    "respx>=0.21",
]

[project.scripts]
app = "app.main:app"
bcf-free-sessions = "app.cli.print_free_sessions:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
