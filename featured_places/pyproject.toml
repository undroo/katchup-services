[project]
name = "featured-places"
version = "0.1.0"
description = "Featured places maintenance: Supabase PostgREST helpers and sync scripts"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic-settings>=2.7",
]

[project.scripts]
sync-badminton-featured-places = "featured_places.scripts.sync_badminton_venues:main"
enrich-featured-places-google = "featured_places.scripts.enrich_google_places:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["featured_places"]
